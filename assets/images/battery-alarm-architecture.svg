<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Battery Alarm module boundaries</title>
  <desc id="desc">The Android app module contains the Compose UI, Hilt composition and Android adapters. It depends on an Android-free Kotlin and JVM domain module that contains contracts and alarm rules.</desc>
  <defs>
    <linearGradient id="app" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#183347"/><stop offset="1" stop-color="#102435"/></linearGradient>
    <linearGradient id="domain" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14363a"/><stop offset="1" stop-color="#102c32"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#72e3c4"/></marker>
  </defs>
  <rect x="8" y="8" width="944" height="374" rx="18" fill="#091723" stroke="#31485b"/>
  <text x="34" y="43" fill="#91a7b8" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="2">COMPILE-TIME MODULES</text>
  <rect x="32" y="65" width="415" height="233" rx="14" fill="url(#app)" stroke="#385369"/>
  <text x="54" y="98" fill="#eef3f6" font-family="system-ui,sans-serif" font-size="19" font-weight="700">:app</text>
  <text x="104" y="97" fill="#8da4b5" font-family="system-ui,sans-serif" font-size="11">Android application · composition root</text>
  <rect x="53" y="119" width="175" height="64" rx="9" fill="#102334" stroke="#385369"/>
  <text x="70" y="145" fill="#dce6eb" font-family="system-ui,sans-serif" font-size="12" font-weight="650">Compose UI</text>
  <text x="70" y="164" fill="#8da4b5" font-family="system-ui,sans-serif" font-size="10">MainViewModel · StateFlow</text>
  <rect x="247" y="119" width="178" height="64" rx="9" fill="#102334" stroke="#385369"/>
  <text x="264" y="145" fill="#dce6eb" font-family="system-ui,sans-serif" font-size="12" font-weight="650">Hilt composition</text>
  <text x="264" y="164" fill="#8da4b5" font-family="system-ui,sans-serif" font-size="10">wires concrete classes</text>
  <rect x="53" y="201" width="372" height="69" rx="9" fill="#102334" stroke="#385369"/>
  <text x="70" y="229" fill="#dce6eb" font-family="system-ui,sans-serif" font-size="12" font-weight="650">Android adapters</text>
  <text x="70" y="248" fill="#8da4b5" font-family="system-ui,sans-serif" font-size="10">DataStore · audio · vibration · notifications</text>
  <rect x="513" y="65" width="415" height="233" rx="14" fill="url(#domain)" stroke="#34706b"/>
  <text x="535" y="98" fill="#eef3f6" font-family="system-ui,sans-serif" font-size="19" font-weight="700">:domain</text>
  <text x="606" y="97" fill="#94c4b8" font-family="system-ui,sans-serif" font-size="11">Kotlin/JVM · no Android SDK</text>
  <rect x="535" y="119" width="371" height="64" rx="9" fill="#102d31" stroke="#34706b"/>
  <text x="554" y="145" fill="#dff1ec" font-family="system-ui,sans-serif" font-size="12" font-weight="650">Contracts / ports</text>
  <text x="554" y="164" fill="#94b8ae" font-family="system-ui,sans-serif" font-size="10">AlarmController · SoundPlayer · Notifier · Settings</text>
  <rect x="535" y="201" width="371" height="69" rx="9" fill="#102d31" stroke="#34706b"/>
  <text x="554" y="229" fill="#dff1ec" font-family="system-ui,sans-serif" font-size="12" font-weight="650">Alarm rules and coordination</text>
  <text x="554" y="248" fill="#94b8ae" font-family="system-ui,sans-serif" font-size="10">state transitions · settings · update decisions</text>
  <path d="M447 156h54" fill="none" stroke="#72e3c4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="474" y="141" text-anchor="middle" fill="#72e3c4" font-family="system-ui,sans-serif" font-size="9" font-weight="700">depends on</text>
  <path d="M425 235h56v-84h45" fill="none" stroke="#92bff0" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <text x="479" y="252" text-anchor="middle" fill="#a7c9ed" font-family="system-ui,sans-serif" font-size="8">implements ports</text>
  <rect x="32" y="320" width="896" height="39" rx="8" fill="#101f2b" stroke="#283f51"/>
  <circle cx="54" cy="339" r="4" fill="#72e3c4"/>
  <text x="68" y="343" fill="#bac8d1" font-family="system-ui,sans-serif" font-size="10">The domain owns policy; the app owns Android integration and dependency wiring.</text>
</svg>
